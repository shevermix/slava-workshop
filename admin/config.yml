backend:
  name: git-gateway
  branch: master

media_folder: "."
public_folder: "."

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "All Content"
        file: "content.json"
        format: "json"
        fields:

          - label: "Contacts"
            name: "site"
            widget: "object"
            fields:
              - { label: "Company name",            name: "name",          widget: "string" }
              - { label: "Phone (digits only)",      name: "phone",         widget: "string", hint: "Example: 5085949313" }
              - { label: "Phone (display format)",   name: "phone_display", widget: "string", hint: "Example: 508-594-9313" }
              - { label: "Instagram URL",            name: "instagram",     widget: "string" }

          - label: "Hero section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Location tag (top badge)", name: "eyebrow",  widget: "string" }
              - { label: "Headline (use \\n for line break)", name: "headline", widget: "string" }
              - { label: "Subtext",                  name: "subtext",  widget: "text"   }
              - { label: "Button text",              name: "cta",      widget: "string" }

          - label: "Badges (3 icons under hero)"
            name: "badges"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "string" }

          - label: "How It Works (3 steps)"
            name: "services"
            widget: "list"
            fields:
              - { label: "Step number", name: "num",   widget: "string" }
              - { label: "Step title",  name: "title", widget: "string" }
              - { label: "Description", name: "text",  widget: "text"   }
              - label: "Video (optional)"
                name: "video"
                widget: "file"
                required: false
                hint: "Upload MP4/MOV clip, or paste a YouTube URL (e.g. https://youtu.be/ABC123). Leave blank for no video."

          - label: "Before & After (gallery)"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Description (e.g. Kitchen 2 — Shaker doors)", name: "material", widget: "string" }
              - { label: "Color before", name: "from", widget: "string", hint: "e.g. Cherry Oak" }
              - { label: "Color after",  name: "to",   widget: "string", hint: "e.g. Matte White" }
              - { label: "Before photo", name: "beforeImg", widget: "image" }
              - { label: "After photo",  name: "afterImg",  widget: "image" }

          - label: "Our Process (steps)"
            name: "process"
            widget: "list"
            fields:
              - { label: "Step number", name: "num",   widget: "string", hint: "e.g. 01" }
              - { label: "Step title",  name: "title", widget: "string" }
              - { label: "Description", name: "desc",  widget: "text" }
              - { label: "Photo",       name: "img",   widget: "image" }

          - label: "Contact form"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Form title",    name: "title", widget: "string" }
              - { label: "Form subtitle", name: "sub",   widget: "string" }

          - label: "Instagram section"
            name: "instagram"
            widget: "object"
            fields:
              - { label: "Section tag",      name: "tag",    widget: "string", required: false }
              - { label: "Heading",          name: "title",  widget: "string", required: false }
              - { label: "Instagram handle", name: "handle", widget: "string", required: false }
              - label: "Posts"
                name: "posts"
                widget: "list"
                fields:
                  - { label: "Preview image", name: "image", widget: "image", required: false, hint: "Upload a screenshot or photo for this post." }
                  - { label: "Caption", name: "caption", widget: "string", required: false, hint: "Short description shown below the photo (optional)." }
                  - { label: "Instagram post URL", name: "url", widget: "string", required: false, hint: "Link to Instagram post (e.g. https://www.instagram.com/p/ABC123/). Card will link here." }
                  - { label: "Show on site", name: "published", widget: "boolean", default: true }
