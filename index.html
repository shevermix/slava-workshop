<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Slavik Workshop — Kitchen Cabinet Painting · Boston, MA</title>
  <meta name="description" content="Professional kitchen cabinet painting in Boston, MA. Eco-friendly paints, 1-year warranty, free estimate by photo. Text 508-594-9313."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css?v=14"/>
  <!-- Netlify Identity (needed for Decap CMS login redirect) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.netlifyIdentity.on('login', function() {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback, createContext, useContext } = React;

/* ── CONTENT CONTEXT ── */
const Ctx = createContext(null);
const useContent = () => useContext(Ctx);

/* Focus the Name field after scrolling to the contact form.
   Skipped on touch devices — auto-opening the keyboard there
   shrinks the viewport and hides the form. */
const focusContactField = () => {
  if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
  setTimeout(() => {
    const el = document.getElementById('f-name');
    if (el) el.focus({ preventScroll: true });
  }, 600);
};

/* Default content (fallback if fetch fails) */
const DEFAULT = {
  site: { name:'Slavik Workshop', phone:'5085949313', phone_display:'508-594-9313', instagram:'https://instagram.com/slavik.workshop' },
  hero: { eyebrow:'Boston, MA', headline:'Professional\nKitchen Cabinet\nPainting', subtext:'Renew your kitchen with a stunning, durable finish. Fast & eco-friendly.', cta:'📷 Free Estimate by Photo' },
  badges: [
    { title:'Eco-Friendly Paint', sub:'Zero fumes · safe for kids & pets' },
    { title:'1-Year Warranty',    sub:'Written guarantee on every job'     },
    { title:'Licensed & Insured', sub:'MA licensed · fully insured'        },
  ],
  services: [
    { num:'01', title:'Prep',   text:'We protect your kitchen with drop cloths and tape, then clean, sand, and prime every surface for a flawless result.' },
    { num:'02', title:'Paint',  text:'Two coats of premium eco-friendly paint applied with professional spray equipment for a smooth, factory-quality finish.' },
    { num:'03', title:'Finish', text:'Final inspection, touch-ups, full cleanup — and a 1-year written warranty on every job we do.' },
  ],
  areas: ['Boston','Middlesex County','Norfolk County','Bristol County','Plymouth County'],
  contact: { title:'Get a Free Estimate', sub:'Text us photos — we reply same day' },
  instagram: { tag:'Follow Us', title:'Follow Our Work', handle:'@slavik.workshop', posts: [] },
};

/* ── NAV ── */
function Nav() {
  const { site } = useContent();
  const links = [['3 Simple Steps','#services'],['Before & After','#portfolio'],['Our Process','#process'],['Follow Our Work','#instagram'],['Service Area','#service-areas'],['Get a Free Estimate','#contact']];
  const [menuOpen, setMenuOpen] = React.useState(false);

  React.useEffect(() => {
    const onResize = () => { if (window.innerWidth > 768) setMenuOpen(false); };
    window.addEventListener('resize', onResize);
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { window.removeEventListener('resize', onResize); document.body.style.overflow = ''; };
  }, [menuOpen]);

  const close = () => setMenuOpen(false);

  return (
    <>
      <nav className="nav">
        <a href="#" className="nav-logo">
          <img src="logo.png" alt={site.name}/>
          <span className="nav-logo-name">
            <span>Slavik</span>
            <span>Workshop</span>
          </span>
        </a>
        <ul className="nav-links">
          {links.map(([label,href],i,arr)=>(
            <React.Fragment key={label}>
              <li><a href={href}>{label}</a></li>
              {i<arr.length-1 && <li><span className="nav-sep">|</span></li>}
            </React.Fragment>
          ))}
        </ul>
        <div className="nav-right">
          <a href={`tel:${site.phone}`} className="nav-phone">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 012 1.18 2 2 0 014 1h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
            {site.phone_display}
          </a>
          <a href={`sms:${site.phone}`} className="btn-nav">Text Us</a>
          <a href={`tel:${site.phone}`} className="nav-phone-mobile" aria-label="Call us">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 012 1.18 2 2 0 014 1h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
          </a>
          <a href={`sms:${site.phone}`} className="nav-sms-mobile" aria-label="Text us">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </a>
          <button
            className={`nav-burger${menuOpen ? ' nav-burger--open' : ''}`}
            onClick={() => setMenuOpen(o => !o)}
            aria-label={menuOpen ? 'Close menu' : 'Open menu'}
            aria-expanded={menuOpen}
          >
            <span className="nav-burger-bar"/>
            <span className="nav-burger-bar"/>
            <span className="nav-burger-bar"/>
          </button>
        </div>
      </nav>
      {ReactDOM.createPortal(
        <>
          <ul className={`mobile-menu${menuOpen ? ' mobile-menu--open' : ''}`}>
            {links.map(([label,href]) => (
              <li key={label}><a href={href} onClick={close}>{label}</a></li>
            ))}
          </ul>
          {menuOpen && <div className="mobile-menu-overlay" onClick={close}/>}
        </>,
        document.body
      )}
    </>
  );
}

/* ── HERO SLIDER ── */
function Hero() {
  const { hero, badges, site } = useContent();
  const [split, setSplit] = useState(50);
  const [active, setActive] = useState(false);
  const rightRef = useRef(null);
  const dragging = useRef(false);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  useEffect(() => {
    const t1 = setTimeout(() => setSplit(28), 700);
    const t2 = setTimeout(() => setSplit(50), 1500);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  const onMove = useCallback((clientX) => {
    if (!dragging.current || !rightRef.current) return;
    const rect = rightRef.current.getBoundingClientRect();
    setSplit(Math.min(95, Math.max(5, (clientX - rect.left) / rect.width * 100)));
  }, []);

  useEffect(() => {
    const up = () => {
      dragging.current = false; setActive(false);
      touchStartX.current = null; touchStartY.current = null;
    };
    const mm = e => onMove(e.clientX);
    const tm = e => {
      if (touchStartX.current === null) return;
      const dx = Math.abs(e.touches[0].clientX - touchStartX.current);
      const dy = Math.abs(e.touches[0].clientY - touchStartY.current);
      if (!dragging.current) {
        if (dx > dy && dx > 5) { dragging.current = true; setActive(true); }
        else if (dy > dx) { touchStartX.current = null; return; }
        else return;
      }
      e.preventDefault();
      onMove(e.touches[0].clientX);
    };
    window.addEventListener('mouseup', up);
    window.addEventListener('mousemove', mm);
    window.addEventListener('touchend', up);
    window.addEventListener('touchmove', tm, { passive: false });
    return () => {
      window.removeEventListener('mouseup', up);
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('touchend', up);
      window.removeEventListener('touchmove', tm);
    };
  }, [onMove]);

  const start = () => { dragging.current = true; setActive(true); };
  const startTouch = e => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
  };
  const onKeyDown = e => {
    if (e.key === 'ArrowLeft') setSplit(s => Math.max(5, s - 5));
    if (e.key === 'ArrowRight') setSplit(s => Math.min(95, s + 5));
  };
  const tr = active ? 'none' : 'left 0.5s cubic-bezier(0.4,0,0.2,1), clip-path 0.5s cubic-bezier(0.4,0,0.2,1)';

  const badgeIcons = [
    <svg key="eco" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>,
    <svg key="war" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
    <svg key="lic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a8 8 0 0 1 16 0v3"/></svg>,
  ];

  return (
    <div className="hero">
      <div className="hero-left">
        <div className="hero-eyebrow">✦ {hero.eyebrow}</div>
        <h1 className="hero-h1">
          {hero.headline.split('\n').map((line, i, arr) => (
            <React.Fragment key={i}>{line}{i < arr.length - 1 && <br/>}</React.Fragment>
          ))}
        </h1>
        <p className="hero-sub">{hero.subtext}</p>
        <a href="#contact" onClick={focusContactField} className="btn-hero">{hero.cta}</a>
      </div>
      <div className="hero-right" ref={rightRef} onMouseDown={start} onTouchStart={startTouch}
        tabIndex={0} role="slider" aria-label="Before/After slider"
        aria-valuemin={5} aria-valuemax={95} aria-valuenow={Math.round(split)}
        onKeyDown={onKeyDown}>
        <div className="hero-before-img"/>
        <div className="hero-after-img" style={{ clipPath: `inset(0 0 0 ${split}%)`, transition: tr }}/>
        <div className="hero-divider" style={{ left: `${split}%`, transition: tr }}/>
        <div className="hero-handle" style={{ left: `${split}%`, transition: tr }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <div className="hero-handle-sep"/>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        {split > 10 && <div className="hero-lbl" style={{ left: 14 }}>Before</div>}
        {split < 90 && <div className="hero-lbl" style={{ left: `calc(${split}% + 14px)`, transition: tr }}>After</div>}
      </div>
      <div className="hero-badges">
        {badges.map((b, i) => (
          <div className="hero-badge" key={i}>
            <span className="hero-badge-icon">{badgeIcons[i]}</span>
            <div>
              <div className="hero-badge-title">{b.title}</div>
              <div className="hero-badge-sub">{b.sub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── SERVICES ── */
function Services() {
  const { services, site } = useContent();

  const icons = [
    <svg key="prep" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>,
    <svg key="paint" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
    <svg key="fin" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
  ];

  const stepRefs = useRef([]);

  useEffect(() => {
    const observer = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('svc-step--visible'); }),
      { threshold: 0.2 }
    );
    stepRefs.current.forEach(el => el && observer.observe(el));
    return () => observer.disconnect();
  }, []);

  return (
    <section className="sec svc-sec" id="services">
      <div className="sec-inner">
        <div className="sec-tag">How It Works</div>
        <h2 className="sec-h2">3 Simple Steps</h2>
        <div className="svc-row">
          {services.map((s, i) => (
            <React.Fragment key={i}>
              <div
                className="svc-step"
                ref={el => stepRefs.current[i] = el}
                style={{ animationDelay: `${i * 0.12}s` }}
              >
                <div className="svc-icon">{icons[i]}</div>
                <div className="svc-num">Step {s.num}</div>
                <div className="svc-title">{s.title}</div>
                <div className="svc-text">{s.text}</div>
              </div>
              {i < services.length - 1 && (
                <div className="svc-arrow">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </div>
              )}
            </React.Fragment>
          ))}
        </div>
        <div className="svc-cta">
          <a href="#contact" onClick={focusContactField} className="btn-hero">📷 Get Your Free Estimate</a>
        </div>
      </div>
    </section>
  );
}

/* ── GALLERY ── */
function Gallery({ openLb }) {
  const { gallery } = useContent();
  const projects = gallery || [];
  const galItems = projects.flatMap(p => [
    { src: p.beforeImg, caption: `${p.material} — Before` },
    { src: p.afterImg,  caption: `${p.material} — After`  },
  ]);
  return (
    <section className="sec gallery-sec" id="portfolio">
      <div className="sec-inner">
        <div className="sec-tag">Our Work</div>
        <h2 className="sec-h2">Before &amp; After</h2>
        <div className="ba-grid">
          {projects.map((p,i)=>(
            <div className="ba-card" key={i}>
              <div className="ba-split">
                <div className="ba-before-img" style={p.beforeImg ? {background:`url('${p.beforeImg}') ${p.beforePos||'center'}/cover no-repeat`} : {}}
                  onClick={() => openLb({ items: galItems, idx: i*2 })} role="button" tabIndex={0}
                  onKeyDown={e=>{ if(e.key==='Enter'||e.key===' ') openLb({ items: galItems, idx: i*2 }); }}
                  aria-label={`View ${p.material} Before`}>
                  <span className="ba-img-lbl">Before</span>
                </div>
                <div className="ba-after-img" style={p.afterImg ? {background:`url('${p.afterImg}') ${p.afterPos||'center'}/cover no-repeat`} : {background:`linear-gradient(145deg,${p.afterBg}bb,${p.afterBg})`}}
                  onClick={() => openLb({ items: galItems, idx: i*2+1 })} role="button" tabIndex={0}
                  onKeyDown={e=>{ if(e.key==='Enter'||e.key===' ') openLb({ items: galItems, idx: i*2+1 }); }}
                  aria-label={`View ${p.material} After`}>
                  <span className="ba-img-lbl">After</span>
                </div>
              </div>
              <div className="ba-desc">
                <div className="ba-trans">{p.from} → {p.to}</div>
                <div className="ba-mat">{p.material}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── PROCESS ── */
function Process({ openLb }) {
  const { process: steps } = useContent();
  const procItems = (steps || []).map(s => ({ src: s.img, caption: `Step ${s.num} — ${s.title}` }));
  return (
    <section className="sec proc-sec" id="process">
      <div className="sec-inner">
        <div className="sec-tag">Behind The Scenes</div>
        <h2 className="sec-h2">Our Process</h2>
        <div className="proc-grid">
          {(steps||[]).map((s,i)=>(
            <div className="proc-card" key={i}>
              <div className="proc-img" style={{backgroundImage:`url('${s.img}')`,backgroundPosition:s.bgPos}}
                onClick={() => openLb({ items: procItems, idx: i })} role="button" tabIndex={0}
                onKeyDown={e=>{ if(e.key==='Enter'||e.key===' ') openLb({ items: procItems, idx: i }); }}
                aria-label={`View Step ${s.num}: ${s.title}`}/>
              <div className="proc-body">
                <div className="proc-num">Step {s.num}</div>
                <div className="proc-title">{s.title}</div>
                <div className="proc-desc">{s.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── INSTAGRAM ── */
function Instagram() {
  const { instagram, site } = useContent();
  const ig = instagram || {};
  const posts = (ig.posts || []).filter(p => p && p.published && (p.image || p.url));

  if (!posts.length) return null;

  return (
    <section className="sec ig-sec" id="instagram">
      <div className="sec-inner">
        <div className="sec-tag">{ig.tag || 'Follow Us'}</div>
        <h2 className="sec-h2">{ig.title || 'Follow Our Work'}</h2>
        {ig.handle && (
          <a className="ig-handle" href={site.instagram} target="_blank" rel="noopener">{ig.handle}</a>
        )}
        <div className="ig-grid">
          {posts.map(p => (
            <a key={p.url || p.image} className="ig-card" href={p.url || '#'} target="_blank" rel="noopener noreferrer">
              {p.image
                ? <img src={p.image} alt="Instagram post" loading="lazy"/>
                : <div className="ig-card-placeholder"><svg width="32" height="32" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></div>
              }
              <div className="ig-card-overlay"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" strokeWidth="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" strokeWidth="2"/><circle cx="17.5" cy="6.5" r="1.2"/></svg></div>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── LIGHTBOX ── */
function Lightbox({ items, idx, onClose, onChange }) {
  const [vis, setVis] = useState(false);
  const item = items[idx];

  useEffect(() => {
    const t = setTimeout(() => setVis(true), 10);
    document.body.style.overflow = 'hidden';
    return () => { clearTimeout(t); document.body.style.overflow = ''; };
  }, []);

  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape')      { setVis(false); setTimeout(onClose, 320); }
      if (e.key === 'ArrowLeft'  && idx > 0)              onChange(idx - 1);
      if (e.key === 'ArrowRight' && idx < items.length-1) onChange(idx + 1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx, items.length, onClose, onChange]);

  const close = () => { setVis(false); setTimeout(onClose, 320); };

  return ReactDOM.createPortal(
    <div className={`lb-bd${vis ? ' lb-bd--in' : ''}`} onClick={close}>
      <button className="lb-x" onClick={e => { e.stopPropagation(); close(); }} aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      {idx > 0 && (
        <button className="lb-arr lb-arr--l" onClick={e => { e.stopPropagation(); onChange(idx-1); }} aria-label="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      )}
      <div className={`lb-wrap${vis ? ' lb-wrap--in' : ''}`} onClick={e => e.stopPropagation()}>
        <img className="lb-img" src={item.src} alt={item.caption}/>
        {item.caption && <div className="lb-cap">{item.caption}</div>}
        {items.length > 1 && (
          <div className="lb-dots">
            {items.map((_,i) => (
              <button key={i} className={`lb-dot${i===idx?' lb-dot--on':''}`}
                onClick={()=>onChange(i)} aria-label={`Photo ${i+1}`}/>
            ))}
          </div>
        )}
      </div>
      {idx < items.length-1 && (
        <button className="lb-arr lb-arr--r" onClick={e => { e.stopPropagation(); onChange(idx+1); }} aria-label="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      )}
    </div>,
    document.body
  );
}

/* ── MAP + CONTACT ── */
const COVERAGE_CENTER = [42.004, -71.333]; // Plainville, MA — service zone center
const COVERAGE_RADIUS = 60000; // meters — ~40 mi / 1h drive from Plainville
const CIRCLE_STYLE    = { color: '#1b5176', weight: 1.5, fillColor: '#2271b3', fillOpacity: 0.16 };

function makeCenterDot() {
  return L.divIcon({
    className: 'map-dot-wrap',
    html: '<span class="map-dot-pulse"></span><span class="map-dot"></span>',
    iconSize: [20, 20],
    iconAnchor: [10, 10],
  });
}

function MapContact() {
  const { contact, site } = useContent();
  const [form, setForm] = useState({ name:'', email:'', phone:'' });
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const [copyDone, setCopyDone] = useState(false);
  const [mapFs, setMapFs] = useState(false);
  const [mapFsClosing, setMapFsClosing] = useState(false);
  const mapDivRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const HOME = { center: [42.05, -71.1], zoom: 8.3 };
  const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));

  const handleSubmit = async ev => {
    ev.preventDefault();
    setSending(true);
    try {
      await fetch('https://formsubmit.co/ajax/slavikworkshop@gmail.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          Name: form.name, Phone: form.phone, Email: form.email,
          _captcha: 'false',
          _subject: `New Estimate — ${form.name}`,
        }),
      });
    } catch(_) {}
    setSending(false);
    setSubmitted(true);
  };

  const copyEmail = async () => {
    const email = 'slavikworkshop@gmail.com';
    try { await navigator.clipboard.writeText(email); }
    catch { const t=document.createElement('textarea'); t.value=email; Object.assign(t.style,{position:'fixed',opacity:'0'}); document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    setCopyDone(true);
    setTimeout(() => setCopyDone(false), 2000);
  };

  const mailtoHref = `mailto:slavikworkshop@gmail.com?subject=${encodeURIComponent(`Kitchen Cabinet Estimate — ${form.name}`)}&body=${encodeURIComponent(`Hi! I submitted an estimate request on your website.\n\nName: ${form.name}\nPhone: ${form.phone}\nEmail: ${form.email}\n\nPlease find my kitchen photos attached to this email.\n\nThank you!`)}`;

  const openFs = () => {
    setMapFs(true);
    document.body.style.overflow = 'hidden';
    if (mapInstanceRef.current) mapInstanceRef.current.scrollWheelZoom.enable();
    setTimeout(() => { if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize(); }, 350);
  };

  const closeFs = () => {
    setMapFsClosing(true);
    if (mapInstanceRef.current) mapInstanceRef.current.scrollWheelZoom.disable();
    setTimeout(() => {
      setMapFs(false);
      setMapFsClosing(false);
      document.body.style.overflow = '';
      setTimeout(() => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.invalidateSize();
          mapInstanceRef.current.setView(HOME.center, HOME.zoom);
        }
      }, 50);
    }, 280);
  };

  const toggleFs = () => mapFs ? closeFs() : openFs();

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape' && mapFs) closeFs(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [mapFs]);

  useEffect(() => {
    if (!mapDivRef.current || mapInstanceRef.current) return;
    const map = L.map(mapDivRef.current, {
      center: HOME.center,
      zoom: HOME.zoom,
      scrollWheelZoom: false,
      attributionControl: false,
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 14,
    }).addTo(map);
    L.control.attribution({ prefix: '© <a href="https://osm.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>' }).addTo(map);
    mapInstanceRef.current = map;
    L.circle(COVERAGE_CENTER, { radius: COVERAGE_RADIUS, ...CIRCLE_STYLE }).addTo(map);
    L.marker(COVERAGE_CENTER, { icon: makeCenterDot() }).addTo(map);
    return () => {
      if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
    };
  }, []);

  return (
    <div className="mc-wrap" id="service-areas">
      <div className="mc-grid">
        <div className="mc-left">
          <div className="sec-tag" style={{textAlign:'left'}}>Coverage</div>
          <h2 className="mc-h2">Service Area</h2>
          <div className={`mc-map-wrap${mapFs ? ' mc-map-wrap--fs' : ''}${mapFsClosing ? ' mc-map-wrap--fs-closing' : ''}`}>
            <div ref={mapDivRef} className="mc-map"/>
            <button className="map-fs-btn" onClick={toggleFs} title={mapFs ? 'Close' : 'Fullscreen'}>
              {mapFs
                ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
              }
            </button>
          </div>
        </div>
        <div className="mc-right" id="contact">
          <div className="mc-head">
            <div className="mc-head-title">{contact.title}</div>
            <div className="mc-head-sub">{contact.sub}</div>
          </div>
          {submitted ? (
            <div className="mc-thanks">
              <div className="mc-thanks-check">
                <svg width="28" height="28" fill="none" stroke="#fff" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
              </div>
              <div className="mc-thanks-title">Thank You!</div>
              <div className="mc-thanks-sub">We received your request. To get an accurate estimate, please send your kitchen photos:</div>

              {isMobile ? (
                <a href={`sms:+1${site.phone}`} className="mc-thanks-row">
                  <div className="mc-thanks-row-icon">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                  </div>
                  <div>
                    <div className="mc-thanks-row-label">Text Photos</div>
                    <div className="mc-thanks-row-val">Tap to text photos →</div>
                  </div>
                </a>
              ) : (
                <div className="mc-thanks-row mc-thanks-row--static">
                  <div className="mc-thanks-row-icon">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                  </div>
                  <div>
                    <div className="mc-thanks-row-label">Text Photos To</div>
                    <div className="mc-thanks-row-val">{site.phone_display}</div>
                  </div>
                </div>
              )}

              {isMobile ? (
                <a href={mailtoHref} className="mc-thanks-row">
                  <div className="mc-thanks-row-icon">
                    <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  </div>
                  <div>
                    <div className="mc-thanks-row-label">Email Photos</div>
                    <div className="mc-thanks-row-val">Tap to open email app →</div>
                  </div>
                </a>
              ) : (
                <button type="button" className="mc-thanks-row" onClick={copyEmail}>
                  <div className="mc-thanks-row-icon">
                    <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  </div>
                  <div>
                    <div className="mc-thanks-row-label">Email Photos</div>
                    <div className="mc-thanks-row-val">{copyDone ? 'Copied!' : 'Click to copy email address →'}</div>
                  </div>
                </button>
              )}

              <div className="mc-thanks-reminder">
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
                <span><strong>[!] Important:</strong> Please attach photos inside your text message or email!</span>
              </div>
            </div>
          ) : (
            <form className="mc-form" onSubmit={handleSubmit} noValidate>
              {[['Name','name','text',true],['Email','email','email',true],['Phone','phone','tel',false]].map(([label,key,type,req])=>(
                <div key={key} className="f-field">
                  <input className="f-inp" placeholder=" " value={form[key]} onChange={set(key)}
                    id={`f-${key}`} type={type} required={req||undefined}/>
                  <label className="f-lbl" htmlFor={`f-${key}`}>
                    {label}{req && <span className="f-req"> *</span>}
                  </label>
                </div>
              ))}
              <button type="submit" className="btn-submit" disabled={sending}>
                {sending ? 'Sending…' : 'Submit Request'}
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── FOOTER ── */
function Footer() {
  const { site } = useContent();
  const links = [['3 Simple Steps','#services'],['Before & After','#portfolio'],['Our Process','#process'],['Follow Our Work','#instagram'],['Service Area','#service-areas'],['Get a Free Estimate','#contact']];
  return (
    <footer className="footer">
      <div className="ft-top">
        <a href="#" className="ft-logo">
          <img src="logo.png" alt={site.name}/>
          <span className="ft-logo-name">Slavik <em>Workshop</em></span>
        </a>
        <ul className="ft-links">
          {links.map(([label,href],i,arr)=>(
            <React.Fragment key={label}>
              <li><a href={href}>{label}</a></li>
              {i<arr.length-1 && <li><span className="nav-sep">|</span></li>}
            </React.Fragment>
          ))}
        </ul>
        <div className="ft-social">
          <a href={site.instagram} target="_blank" rel="noopener" title="Instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="#" title="Facebook">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
          </a>
          <a href="#" title="YouTube">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.96A29 29 0 0023 12a29 29 0 00-.46-5.58zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
          </a>
        </div>
      </div>
      <div className="ft-copy">
        © {new Date().getFullYear()} {site.name}. Licensed &amp; Insured. <a href={`tel:${site.phone}`}>({site.phone.slice(0,3)}) {site.phone.slice(3,6)}-{site.phone.slice(6)}</a>
      </div>
    </footer>
  );
}

/* ── APP ── */
function App() {
  const [content, setContent] = useState(null);
  const [lb, setLb] = useState(null);
  const closeLb  = useCallback(() => setLb(null), []);
  const changeLb = useCallback(i => setLb(l => l ? {...l, idx: i} : l), []);

  useEffect(() => {
    fetch('./content.json?v=' + Date.now())
      .then(r => r.json())
      .then(setContent)
      .catch(() => setContent(DEFAULT));
  }, []);

  if (!content) return null;

  return (
    <Ctx.Provider value={content}>
      {lb && <Lightbox items={lb.items} idx={lb.idx} onClose={closeLb} onChange={changeLb}/>}
      <Nav/>
      <Hero/>
      <Services/>
      <Gallery openLb={setLb}/>
      <Process openLb={setLb}/>
      <Instagram/>
      <MapContact/>
      <Footer/>
      <a href={`sms:${content.site.phone}`} className="sms-btn" title="Text us">💬</a>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
